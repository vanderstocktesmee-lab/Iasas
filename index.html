<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iasas</title>
    <style>
        body {
            background-color: #F5E6CE; 
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .welcome {
            text-align: center;
            font-weight: 500;
            color: darkkhaki;
            font-size: 32px;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .rubiks-section, .penspin-section {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            margin-left: 20px;
            margin-bottom: 15px;
        }

      
        .rubiks, .penspin, .coinflipping {
            color: wheat;
            background-color: burlywood;
            width: 500px;
            border-radius: 20px;
            cursor: pointer;
            border: none;
            padding: 15px;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .psfoto {
            width: 205px;
            border-radius: 10px;
        }

        .rubiksfoto {
            width: 250px;
            border-radius: 10px;
        }

        .rubiksfotocool2 {
            width: 350px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <p class="welcome">Welcome to Iasas!</p>

    <div class="rubiks-section">
        <button class="rubiks" onclick="window.location.href='rubikscubesolving.html'">
            <h1>Rubiks cube solving</h1>
            <p>U wanna learn how to solve a rubiks cube to impress yourself and everyone you know?</p>
            <p>This tutorial gives u everything u need to know,</p>
            <p>from solving the first side to solving the cube in under 30sec!</p>
        </button>

        <img class="rubiksfoto" src="rubiks-Photoroom.png">
        <img class="rubiksfotocool2" src="rubiksimage2cool-Photoroom.png">
    </div>

    <div class="penspin-section">
        <button class="penspin" onclick="window.location.href='penspinning.html'">
            <h1>Pen spinning</h1>
            <p>U wanna learn how to pen spin?</p>
            <p>Pen spinning is rly fun and impressive and a fun thing to do in class.</p>
            <p>It's rly basic cuz all u need is a pen and some good hands</p>
        </button>
        <img class="psfoto" src="penspinning-removebg-preview.png" >
    </div>

    <div class="penspin-section">
        <div class="coinflipping">
            <h1>Coin flipping</h1>
            <p>U wanna learn how to flip a coin between your fingers?</p>
            <p>Coin flipping is a rly cool trick to do with not much materials ☻</p>
            <p>This is the ideal trick to do with only a coin and not that much practice.</p>
        </div>
    </div>

</body>
</html>
